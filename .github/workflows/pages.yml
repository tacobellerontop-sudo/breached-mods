name: Publish the mods site

# Zips each mod in mods/ and publishes the site (site/ plus the zips) to
# GitHub Pages: https://tacobellerontop-sudo.github.io/breached-mods/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the mods' scripts parse
        run: |
          for f in $(find mods -name '*.js' -o -name '*.mjs'); do
            node --check "$f" 2>/dev/null || node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: Build the site
        run: python3 scripts/build.py _site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
